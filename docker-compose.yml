services:
  db:
    image: postgres:16
    container_name: pace_yourself_db
    environment:
      POSTGRES_USER: pace
      POSTGRES_PASSWORD: pace
      POSTGRES_DB: pace_yourself
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pace -d pace_yourself"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
